<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 164" role="img" aria-labelledby="title description">
  <title id="title">A Quantum Conundrum</title>
  <desc id="description">The small experiment from Akshay's website. Collect five signals before time runs out.</desc>
  <style>
    .box-icon { animation: float 5s ease-in-out infinite; }
    .signals circle { opacity: .2; }
    .signals circle:nth-child(1) { animation: signal-1 5s steps(1) infinite; }
    .signals circle:nth-child(2) { animation: signal-2 5s steps(1) infinite; }
    .signals circle:nth-child(3) { animation: signal-3 5s steps(1) infinite; }
    .signals circle:nth-child(4) { animation: signal-4 5s steps(1) infinite; }
    .signals circle:nth-child(5) { animation: signal-5 5s steps(1) infinite; }
    .action { animation: ready 5s steps(1) infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes signal-1 { 0%, 9% { opacity: .2; } 10%, 89% { opacity: 1; } 90%, 100% { opacity: .2; } }
    @keyframes signal-2 { 0%, 23% { opacity: .2; } 24%, 89% { opacity: 1; } 90%, 100% { opacity: .2; } }
    @keyframes signal-3 { 0%, 37% { opacity: .2; } 38%, 89% { opacity: 1; } 90%, 100% { opacity: .2; } }
    @keyframes signal-4 { 0%, 51% { opacity: .2; } 52%, 89% { opacity: 1; } 90%, 100% { opacity: .2; } }
    @keyframes signal-5 { 0%, 65% { opacity: .2; } 66%, 89% { opacity: 1; } 90%, 100% { opacity: .2; } }
    @keyframes ready { 0%, 79%, 90%, 100% { fill: #008080; } 80%, 89% { fill: #009d98; } }
    @media (prefers-reduced-motion: reduce) {
      .box-icon, .signals circle, .action { animation: none; }
      .signals circle { opacity: 1; }
    }
  </style>
  <rect x="1" y="1" width="758" height="162" rx="24" fill="#161d20" stroke="#334649" stroke-width="2"/>

  <!-- The Box icon, tile, type hierarchy and button mirror Quantalink's quantum lobby. -->
  <rect x="29" y="49" width="66" height="66" rx="18" fill="#173134" stroke="#31575a"/>
  <g class="box-icon">
    <g transform="translate(47 67) scale(1.25)" fill="none" stroke="#62d2c9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
      <path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>
    </g>
  </g>
  <g class="signals" fill="#62d2c9">
    <circle cx="46" cy="106" r="1.8"/>
    <circle cx="54" cy="106" r="1.8"/>
    <circle cx="62" cy="106" r="1.8"/>
    <circle cx="70" cy="106" r="1.8"/>
    <circle cx="78" cy="106" r="1.8"/>
  </g>

  <g font-family="Space Grotesk, Arial, Helvetica, sans-serif">
    <text x="120" y="52" fill="#62d2c9" font-size="10" font-weight="600" letter-spacing="1.6">A SMALL EXPERIMENT</text>
    <text x="119" y="86" fill="#eef5f4" font-size="24" font-weight="600" letter-spacing="-1">A Quantum Conundrum</text>
    <text x="120" y="112" fill="#b6c4c5" font-size="12">Collect five signals before time runs out.</text>
    <text x="120" y="132" fill="#b6c4c5" font-size="12">A familiar visitor might join you afterwards.</text>
  </g>

  <rect class="action" x="562" y="58" width="174" height="48" rx="14" fill="#008080"/>
  <text x="649" y="87" fill="#f4fbfa" text-anchor="middle" font-family="Space Grotesk, Arial, Helvetica, sans-serif" font-size="13" font-weight="500">Play the experiment</text>
</svg>
